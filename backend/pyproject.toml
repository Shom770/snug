[project]
name = "snug-backend"
version = "0.1.0"
description = "snug's forecasting brain: weather in, Jev decides comfort, outfit and descriptor"
requires-python = ">=3.13"
# what the Cloudflare Worker bundles (keep it to packages that run on Pyodide)
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "tzdata",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    # local development only
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
